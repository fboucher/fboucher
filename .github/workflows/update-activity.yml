name: Update activity section
on:
  schedule: [{ cron: "17 6 * * *" }]   # daily, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_activity.py
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_PAT }}
      - name: Commit if changed
        run: |
          git add README.md assets/activity.svg
          git diff --cached --quiet && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh activity section" && git push
